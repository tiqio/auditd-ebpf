# auditd-ebpf 只把完成规则匹配和 argv 输出策略后的单行记录交给 journal。rsyslog 不得解析、
# 重建或补齐 aN 字段，否则会破坏 suppressed 事件的安全边界和逐字节一致性。
module(load="imjournal" StateFile="auditd-ebpf-imjournal.state")

global(
  DefaultNetstreamDriver="gtls"
  DefaultNetstreamDriverCAFile="/etc/rsyslog.d/audit-ca.pem"
  DefaultNetstreamDriverCertFile="/etc/rsyslog.d/audit-client.pem"
  DefaultNetstreamDriverKeyFile="/etc/rsyslog.d/audit-client-key.pem"
)

template(name="AuditdEbpfRaw" type="string" string="%msg%\n")

ruleset(name="auditd_ebpf_events") {
  action(
    type="omfile"
    File="/var/log/auditd-ebpf/events.log"
    FileOwner="root"
    FileGroup="auditd-ebpf-auditors"
    FileCreateMode="0640"
    DirCreateMode="0750"
    template="AuditdEbpfRaw"
  )

  # 离线导出副本不得被组用户读取；外部保留任务按 retention_days=90 加密归档并删除。
  action(
    type="omfile"
    File="/var/spool/rsyslog/auditd-ebpf-export.log"
    FileOwner="root"
    FileGroup="root"
    FileCreateMode="0600"
    DirCreateMode="0700"
    template="AuditdEbpfRaw"
  )

  # 远端接收端必须按审批记录配置 1–3650 天保留期；本地部署示例为 90 天。
  action(
    type="omfwd"
    Target="audit-logs.example.invalid"
    Port="6514"
    Protocol="tcp"
    StreamDriver="gtls"
    StreamDriverMode="1"
    StreamDriverAuthMode="x509/name"
    StreamDriverPermittedPeers="audit-logs.example.invalid"
    template="AuditdEbpfRaw"
    action.resumeRetryCount="-1"
    queue.type="LinkedList"
    queue.size="250000"
    queue.filename="auditd-ebpf-forward"
    queue.spoolDirectory="/var/spool/rsyslog"
    queue.maxDiskSpace="4g"
    queue.highWatermark="180000"
    queue.lowWatermark="60000"
    queue.discardMark="200000"
    queue.discardSeverity="8"
    queue.saveonshutdown="on"
  )
}

ruleset(name="auditd_ebpf_operations") {
  action(
    type="omfile"
    File="/var/log/auditd-ebpf/operations.log"
    FileOwner="root"
    FileGroup="auditd-ebpf-auditors"
    FileCreateMode="0640"
    DirCreateMode="0750"
    template="AuditdEbpfRaw"
  )
}

if $programname == 'auditd-ebpf' and $msg contains 'type=AUDITD_EBPF ' then {
  call auditd_ebpf_events
  stop
}

if $programname == 'auditd-ebpf' and (
  $msg contains 'type=AUDITD_EBPF_STATUS' or
  $msg contains 'type=AUDITD_EBPF_DIAG' or
  $msg contains 'type=AUDITD_EBPF_GAP'
) then {
  call auditd_ebpf_operations
  stop
}
